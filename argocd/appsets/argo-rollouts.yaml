---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: "argo-rollouts-{{ .name }}"
    spec:
      # TODO make a real project
      project: default
      sources:
        - repoURL: https://github.com/voidlily/kubelab
          targetRevision: HEAD
          path: argocd/apps/argo-rollouts/base/
      destination:
        name: "{{ .name }}"
        namespace: argo-rollouts
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - CreateNamespace=true
