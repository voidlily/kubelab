---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: "cert-manager-{{ .name }}"
    spec:
      # TODO make a real project
      project: default
      sources:
        - repoURL: oci://quay.io/jetstack/charts/cert-manager
          targetRevision: v1.20.2
          path: .
          helm:
            releaseName: cert-manager
            valueFiles:
              - $values/argocd/apps/cert-manager/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/voidlily/kubelab
          targetRevision: HEAD
          ref: values
      destination:
        name: "{{ .name }}"
        namespace: cert-manager
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - CreateNamespace=true
