---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: "metrics-server-{{ .name }}"
    spec:
      # TODO make a real project
      project: default
      sources:
        - repoURL: https://kubernetes-sigs.github.io/metrics-server/
          chart: metrics-server
          targetRevision: 3.14.0
          helm:
            releaseName: metrics-server
            valueFiles:
              - $values/argocd/apps/metrics-server/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/voidlily/kubelab
          targetRevision: HEAD
          ref: values
      destination:
        name: "{{ .name }}"
        namespace: metrics-server
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - CreateNamespace=true
